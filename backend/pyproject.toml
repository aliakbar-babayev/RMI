[project]
name = "backend"
version = "0.1.0"
description = "RM AI Phase 1 backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-cloud-aiplatform>=2.4.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
